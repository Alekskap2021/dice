<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Кости</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='10' fill='%23e8d9b0' stroke='%235a3a1a' stroke-width='3'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%23331'/%3E%3Ccircle cx='44' cy='44' r='5' fill='%23331'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23a32d1f'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="vignette"></div>

    <section id="menu" class="screen">
      <div class="panel menu-panel">
        <h1>Кости</h1>
        <p class="subtitle">Игра для таверны</p>

        <label class="field">
          <span>Ваше имя</span>
          <input id="name" maxlength="16" placeholder="Генрих" autocomplete="off" />
        </label>

        <div class="field">
          <span>Играем до очков</span>
          <div id="targets" class="chips"></div>
        </div>

        <div class="menu-buttons">
          <button id="btn-bot" class="btn primary">Играть с ботом</button>
          <button id="btn-create" class="btn">Создать комнату</button>
          <div class="join-row">
            <input id="code" maxlength="4" placeholder="КОД" autocomplete="off" />
            <button id="btn-join" class="btn">Войти</button>
          </div>
          <button id="btn-rules" class="btn ghost">Правила игры</button>
        </div>
        <p id="menu-error" class="error"></p>
      </div>
    </section>

    <section id="lobby" class="screen hidden">
      <div class="panel lobby-panel">
        <h2>Комната</h2>
        <div class="room-code" id="room-code">----</div>
        <p class="muted">Отправьте приглашение другу</p>
        <div class="invite-row">
          <input id="invite-link" readonly />
          <button id="btn-copy" class="btn">Скопировать</button>
          <button id="btn-share" class="btn hidden">Поделиться</button>
        </div>
        <ul id="lobby-players" class="lobby-players"></ul>
        <p class="muted">Играем до <b id="lobby-target">0</b> очков</p>
        <div class="menu-buttons">
          <button id="btn-start" class="btn primary" disabled>Начать игру</button>
          <button id="btn-lobby-leave" class="btn ghost">Выйти</button>
        </div>
        <p id="lobby-error" class="error"></p>
      </div>
    </section>

    <section id="hud" class="hidden">
      <div class="topbar">
        <div id="scoreboard" class="scoreboard"></div>
        <div class="tools">
          <button id="btn-mute" class="icon-btn" title="Звук">♪</button>
          <button id="btn-hud-rules" class="icon-btn" title="Правила">?</button>
          <button id="btn-leave" class="icon-btn" title="Выйти">✕</button>
        </div>
      </div>
      <div class="turn-info">
        <div id="turn-label"></div>
        <div id="turn-score"></div>
      </div>
      <ol id="log" class="log"></ol>
      <div id="banner" class="banner"></div>
      <div class="controls">
        <div id="selection-info" class="selection-info"></div>
        <div class="control-buttons">
          <button id="btn-roll" class="btn primary big hidden">Бросить кубики</button>
          <button id="btn-keep-roll" class="btn big hidden">Взять и бросить ещё</button>
          <button id="btn-keep-bank" class="btn primary big hidden">Взять и забрать очки</button>
        </div>
      </div>
    </section>

    <div id="rules-modal" class="modal hidden">
      <div class="panel rules-panel">
        <h2>Правила</h2>
        <div id="rules-body"></div>
        <button id="btn-rules-close" class="btn primary">Понятно</button>
      </div>
    </div>

    <div id="over-modal" class="modal hidden">
      <div class="panel over-panel">
        <h2 id="over-title"></h2>
        <p id="over-text" class="muted"></p>
        <div class="menu-buttons">
          <button id="btn-again" class="btn primary">Сыграть ещё</button>
          <button id="btn-over-menu" class="btn ghost">В меню</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
